# pnpm >= 10 refuses to run dependency build scripts unless they are approved
# here, and exits non-zero while any are pending. WXT shells out to
# `pnpm install` during `wxt build`, so that non-zero exit aborted the entire
# extension build. esbuild needs its postinstall to fetch the platform binary.
allowBuilds:
  esbuild: true
  spawn-sync: false
