<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Reset/verify links carry tokens in the URL; never leak them via Referer. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LeadEcho - Social Intent Orchestrator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <!-- Umami. data-exclude-search: verify/reset URLs carry tokens in the query.
         data-domains: only production is counted (not staging or localhost). -->
    <script
      defer
      src="https://analytics.rohan.sh/script.js"
      data-website-id="e53e82f3-a94f-4423-98a0-58157d5357d5"
      data-exclude-search="true"
      data-domains="leadecho.app,www.leadecho.app"
    ></script>
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
