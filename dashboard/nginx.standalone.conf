server {
    listen 3100;
    server_name _;

    # Behind Traefik (TLS terminates there, proxies to us on :3100 over http).
    # Emit relative redirects so we never leak the internal http scheme/:3100
    # into Location headers — otherwise `/` → `http://host:3100/app/` breaks HTTPS.
    absolute_redirect off;
    port_in_redirect off;

    # Re-resolve the api container through Docker's DNS. A literal
    # proxy_pass host is resolved once at startup, so recreating only the api
    # container (a backend-only deploy) left nginx on a dead IP: 502 on every
    # /api call until the dashboard restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8090;

    # Dashboard SPA served at the root — no redirect, no separate marketing site.
    root /usr/share/nginx/dashboard;

    # index.html must revalidate every load: without Cache-Control, browsers
    # heuristically reuse an old copy (and its old hashed bundle) after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass $api_upstream; # no URI part: request URI passed through unchanged
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UTM redirect
    location /r/ {
        proxy_pass $api_upstream; # no URI part: request URI passed through unchanged
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
