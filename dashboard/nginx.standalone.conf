server {
    listen 3100;
    server_name _;

    # Behind Traefik (TLS terminates there, proxies to us on :3100 over http).
    # Emit relative redirects so we never leak the internal http scheme/:3100
    # into Location headers — otherwise `/` → `http://host:3100/app/` breaks HTTPS.
    absolute_redirect off;
    port_in_redirect off;

    # Root redirects into the SPA — no separate marketing site in this build.
    location = / {
        return 302 /app/;
    }

    # Dashboard SPA at /app
    location /app/ {
        alias /usr/share/nginx/dashboard/;
        try_files $uri $uri/ /app/index.html;
    }

    location /app/assets/ {
        alias /usr/share/nginx/dashboard/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://api:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UTM redirect
    location /r/ {
        proxy_pass http://api:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
