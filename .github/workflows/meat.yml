name: meat reading diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  meat:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set on this repo — meat cannot run. Add it with: gh secret set ANTHROPIC_API_KEY"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install meat
        run: go install meat.dev/cmd/meat@latest

      - name: Generate reading diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" | meat > /tmp/meat-raw.txt

      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🥩 Reading diff"
            echo
            echo '```diff'
            head -c 60000 /tmp/meat-raw.txt
            echo '```'
            echo
            echo "_Abridged by [meat](https://github.com/boldsoftware/meat) — mechanical noise elided, behavior-bearing changes kept._"
          } > /tmp/meat-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --edit-last --body-file /tmp/meat-comment.md \
            || gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/meat-comment.md
